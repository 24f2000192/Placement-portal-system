<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    
    {% extends 'base.html' %}
    {% block title %}Welcome - Placement Portal {% endblock %}
    {% block content %}
    <div class="text-center py-5">
        <h1>Placement Portal</h1>
        <p class="lead">Connecting students with Opportunities</p>
        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg me-3">Login</a>
            <br>
            <a href="{{ url_for('student_register') }}" class="btn btn-outline-primary btn-lg">Register as student</a>
            <a href="{{ url_for('company_register') }}" class="btn btn-outline-primary btn-lg">Register as company</a>
        </div>
    </div>
    {% endblock %}
</body>
</html>
