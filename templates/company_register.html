<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>company register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends 'base.html' %}
    {% block title %}Register{% endblock %}
    {% block content %}
    <style>
        body
        {
            background-color: rgb(145, 98, 190);
            background-size: cover;
            background-position: center;
        }
            .overlay {
                background-color: rgba(221, 193, 193, 0.5);
                min-height: 80vh;
                padding: 50px;
                border-radius: 10px;
            }
    </style>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h2 class="h4 mb-0">Company Registration</h2>
                    <form method="POST">
        <div >
            <label>HR Name</label>
            <input type="text" name="name" class="form-control" placeholder="HR name" required>
        </div>
        <div class="mb-3">
            <label>Company Name</label>
            <input type="text" name="company_name" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>HR Contact</label>
            <input type="text" name="hr_contact" class="form-control">
        </div>
        <div class="mb-3">
            <label>Website</label>
            <input type="text" name="website" class="form-control">
        </div>
        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
            Register Company
        </button>
    </form>
                </div>
                <div class="card-body p-4">
    </div>

    
    {% endblock %}
    
</body>
</html>
