<body>{% extends "base.html" %}

{% block content %}
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h2 class="fw-bold text-light">Update Profile</h2>
                <form action="/profile_update" method="POST">
                    <div class="form-group">
                        <label for="name" class="btn btn-info">Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}">
                    </div>
                    <div class="form-group">
                        <label for="email" class="btn btn-info">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}">
                    </div>
                    <div class="form-group">
                        <label for="branch" class="btn btn-info">Branch</label>
                        <input type="text" class="form-control" id="branch" name="branch" value="{{ student.branch }}">
                    </div>
                    <div class="form-group">
                        <label for="cgpa"class="btn btn-info">CGPA</label>
                        <input type="number" class="form-control" id="cgpa" name="cgpa" value="{{ student.cgpa }}" step="0.01" min="0" max="10">
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}</body>
