<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    {% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card mt-4">
            <div class="card-header"><h4>Register</h4></div>
            <div class="card-body">
                <form method="POST">
                    <!-- Role Selection (decides which extra fields appear) -->
                    <div class="mb-3">
                        <label class="form-label">Register as</label>
                        <select name="role" class="form-control" id="roleSelect"
                                onchange="toggleFields()">
                            <option value="student">Student</option>
                            <option value="company">Company</option>
                        </select>
                    </div>

                    <!-- Common fields -->
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <!-- Student-specific fields -->
                    <div id="studentFields">
                        <div class="mb-3">
                            <label class="form-label">Student ID (Roll No)</label>
                            <input type="text" name="student_id_number" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="text" name="contact" class="form-control">
                        </div>
                    </div>

                    <!-- Company-specific fields (hidden by default) -->
                    <div id="companyFields" style="display:none">
                        <div class="mb-3">
                            <label class="form-label">Company Name</label>
                            <input type="text" name="company_name" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">HR Contact</label>
                            <input type="text" name="hr_contact" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Website</label>
                            <input type="url" name="website" class="form-control">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">Register</button>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- JS to toggle student/company fields — this is UI toggle, not core logic -->
<script>
function toggleFields() {
    var role = document.getElementById('roleSelect').value;
    document.getElementById('studentFields').style.display = role==='student'?'block':'none';
    document.getElementById('companyFields').style.display = role==='company'?'block':'none';
}
</script>
{% endblock %}
</body>
</html>
