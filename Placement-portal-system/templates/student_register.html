<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    {% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<style>
        body
        {
            background-color: rgb(145, 98, 190);
            background-size: cover;
            background-position: center;
        }
            .overlay {
                background-color: rgba(221, 193, 193, 0.5);
                min-height: 80vh;
                padding: 50px;
                border-radius: 10px;
            }
    </style>

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center py-3">
                <h2 class="h4 mb-0">Student Registration</h2>
            </div>

            <div class="card-body p-4">

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>

                    <div class="row mb-3">

                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <div class="col">
                            <label class="form-label">Branch</label>
                            <input type="text" name="branch" class="form-control" placeholder="CSE">
                        </div>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Resume (PDF)</label>
                        <input type="file" name="resume" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>
                        <input type="number" step="0.01" name="cgpa" class="form-control">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Create Account
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
</body>
</html>
